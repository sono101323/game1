<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文字ゴマ道場</title>
<meta name="description" content="入力した一文字がそのまま3Dのコマになる対戦ゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@900&family=Noto+Serif+JP:wght@900&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700&family=Zen+Maru+Gothic:wght@900&display=swap">
<style>
/* Layout: 全画面の3Dスタジアム。設定は左上（スマホでは下）に浮かぶ札、対戦中はHUDだけ残す。
   夜の道場をイメージした一色の世界（藍墨の地に真鍮色）で、ライト/ダーク共通。 */
:root {
  --ink: #10162a;         /* 地：藍墨 */
  --panel: #1a2340;       /* 札の地 */
  --line: #2f3b63;        /* 罫 */
  --paper: #efe9da;       /* 文字：生成り */
  --muted: #9aa3c0;       /* 補助文字 */
  --brass: #d9a441;       /* アクセント：真鍮 */
  --you: #e9724c;         /* 自分のコマ */
  --foe: #4cb3e9;         /* 相手のコマ */
  --foe2: #7fcf8a;        /* 3人目 */
  --foe3: #c49af2;        /* 4人目 */
  --ok: #6cc08b;          /* 準備OK */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--ink); color: var(--paper);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#arena { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
button, input { font: inherit; color: inherit; }
/* スマホのブラウザは文字が16px未満の入力欄に触れると画面を拡大するので、入力欄は16px以上にする */
input { font-size: max(16px, 1em); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.sheet {
  position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
  width: min(340px, calc(100% - 32px)); max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; box-sizing: border-box;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 18px; display: flex; flex-direction: column; gap: 16px;
  backdrop-filter: blur(6px);
}
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
/* PC：設定を左右2列に分け、右列に「CPUと対戦／オンライン」を置いて画面内に収める */
@media (min-width: 900px) {
  .sheet { width: min(740px, calc(100% - 32px)); flex-direction: row; align-items: flex-start; gap: 28px; }
  .sheet > .col { flex: 1 1 0; }
}
/* 横幅に余裕があれば、待機中のスタジアムを設定の右側に寄せる */
@media (min-width: 1100px) {
  body:not(.playing) #arena { left: 772px; }
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: .04em; }
.brand small { color: var(--muted); font-size: 12px; }
.label { font-size: 11px; letter-spacing: .14em; color: var(--muted); }

.pick { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: start; }
.charbox { display: flex; flex-direction: column; gap: 6px; }
#charInput {
  width: 92px; height: 92px; box-sizing: border-box; text-align: center;
  font-size: 56px; line-height: 1; padding: 0; background: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; color: var(--paper);
}
#charInput:focus { border-color: var(--brass); outline: none; }
#charInput.multi { font-size: 20px; text-align: left; padding: 0 8px; }
#preview { width: 92px; height: 92px; background: var(--ink); border-radius: 4px; border: 1px solid var(--line); }
.stats { display: grid; gap: 7px; min-width: 0; }
.stat { display: grid; grid-template-columns: 2.6em 1fr 2.2em; gap: 8px; align-items: center; font-size: 13px; }
.stat b { font-weight: 700; }
.bar { height: 8px; background: var(--ink); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brass); width: 0; transition: width .35s ease; }
.stat span { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.raw { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.fonts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 3px;
  padding: 4px 10px; font-size: 13px; color: var(--paper);
}
.chip[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }

.foe { display: flex; align-items: center; gap: 10px; }
.foe .glyph { width: 44px; height: 44px; display: grid; place-items: center; font-size: 30px; border: 1px solid var(--line); border-radius: 4px; color: var(--foe); background: var(--ink); }
.foe .who { flex: 1; min-width: 0; font-size: 13px; }
.cpuhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cpulist { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.cpulist .glyph, .members .glyph { width: 44px; height: 44px; display: grid; place-items: center; font-size: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--ink); }
.members { display: flex; flex-direction: column; gap: 6px; }
.member { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.member .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.member .who .nm { font-weight: 700; overflow-wrap: anywhere; }
.member .who .sub { font-size: 11px; color: var(--muted); }
.member { padding: 6px; border: 1px solid transparent; border-radius: 4px; }
.member.is-ready { border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.pill { flex: none; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok); border-color: var(--ok); color: var(--ink); font-weight: 700; }
.readystatus { margin: 0; font-size: 13px; color: var(--paper); }
#readyBtn.ready { background: var(--ok); color: var(--ink); }
#onIn .row > #readyBtn { flex: 2.2; }
#onIn .row > #leaveRoom { flex: 1; }
.member.empty { color: var(--muted); font-size: 12px; }
.member.empty .glyph { border-style: dashed; color: var(--muted); font-size: 18px; }
.skillpick, .shape { display: flex; flex-direction: column; gap: 6px; }
#shapeBtns .chip { min-width: 2.4em; }
.foes { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.foes .g { font-size: 22px; }
.foes .side.out, .hud .side.out { opacity: .35; }
.skillbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); display: grid; }
#skillBtn:disabled { opacity: .45; }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding: 6px 14px;
  background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 4px;
  font-family: var(--font-display); font-size: 18px; white-space: nowrap; pointer-events: none; animation: toast 1.4s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px); } 12% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; } }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; font-size: 13px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tab { background: transparent; border: 0; padding: 8px; font-size: 13px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--brass); }
.pane, #onOut, #onIn { display: flex; flex-direction: column; gap: 12px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
.joinrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
#codeIn { background: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; letter-spacing: .3em; text-transform: uppercase; min-width: 0; font-size: 16px; }
#codeIn:focus { border-color: var(--brass); outline: none; }
.namerow { display: flex; flex-direction: column; gap: 4px; }
#nameIn { background: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; min-width: 0; font-size: 16px; }
#nameIn:focus { border-color: var(--brass); outline: none; }
.side .nm { font-size: 11px; color: var(--muted); max-width: 6em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.codeline { display: flex; align-items: center; gap: 10px; }
#codeOut { font-family: var(--font-display); font-size: 26px; letter-spacing: .2em; color: var(--brass); flex: 1; user-select: all; }
.chat { display: flex; flex-direction: column; gap: 6px; }
.chatlog { max-height: 132px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; font-size: 13px; line-height: 1.45;
  background: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; overflow-wrap: anywhere; }
.chatlog:empty::before { content: "メッセージを送ると、ここに表示されます"; color: var(--muted); font-size: 12px; }
.chatlog .line b { font-weight: 700; margin-right: .5em; }
.chatlog .me b { color: var(--you); }
.chatlog .opp b { color: var(--foe); }
.chatlog .sys { color: var(--muted); font-size: 12px; }
.chatform { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
#chatIn { background: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0; font-size: 16px; }
#chatIn:focus { border-color: var(--brass); outline: none; }
/* 対戦中はスタジアムの左上に小さく重ねる */
.chat.float { position: absolute; left: 16px; top: 56px; width: min(300px, calc(100% - 32px)); padding: 8px; box-sizing: border-box;
  background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 4px; }
.chat.float .chatlog { max-height: 78px; }
/* スマホの対戦中：スタジアムの下に置く */
.chat.dock { margin: 10px 16px 16px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.chat.dock .chatlog { max-height: 84px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.go {
  border: 0; border-radius: 4px; padding: 12px; background: var(--brass); color: var(--ink);
  font-family: var(--font-display); font-size: 18px; letter-spacing: .1em;
}
.go:disabled { opacity: .4; cursor: not-allowed; }
.msg { min-height: 1.2em; font-size: 12px; color: var(--you); margin: -8px 0 0; }
.streak { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.hud {
  position: absolute; left: 16px; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; pointer-events: none;
}
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side.r { flex-direction: row-reverse; }
.side .g { font-size: 30px; line-height: 1; }
.side .spin { flex: 1; height: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.side .spin i { display: block; height: 100%; width: 100%; }
.side.r .spin i { margin-left: auto; }
#timer { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }

.launch {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px));
  display: grid; gap: 10px; text-align: center;
}
.gauge { position: relative; height: 16px; border: 1px solid var(--line); border-radius: 2px; background: color-mix(in srgb, var(--panel) 85%, transparent); overflow: hidden; }
.gauge i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--muted), var(--brass) 70%, var(--you)); }
.gauge::after { content: ""; position: absolute; left: 88%; top: 0; bottom: 0; width: 2px; background: var(--paper); opacity: .5; }

.result {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--ink) 55%, transparent);
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 24px; width: min(320px, 100%); box-sizing: border-box; display: grid; gap: 14px; text-align: center; }
.verdict { font-family: var(--font-display); font-size: 72px; line-height: 1; }
.reason { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1; }

@media (max-width: 640px) {
  /* スマホでは上にスタジアム、その下に設定を縦に並べ、ページ全体をスクロールさせる */
  html, body { height: auto; }
  body { overflow-x: hidden; overflow-y: auto; }
  #arena { position: relative; inset: auto; height: clamp(300px, 52vh, 460px); }
  body.playing #arena { height: clamp(360px, 80vh, 720px); }
  body.playing.chatdock #arena { height: clamp(340px, 66vh, 640px); }
  .hud, .launch { top: auto; }
  .hud { top: 12px; }
  .launch { bottom: 14px; }
  .sheet { position: static; width: auto; max-height: none; margin: 12px 16px 24px; padding: 14px; gap: 12px; backdrop-filter: none; }
  .pick { grid-template-columns: 72px 1fr; gap: 12px; }
  #charInput, #preview { width: 72px; height: 72px; }
  #charInput { font-size: 44px; }
  #charInput.multi { font-size: 18px; }
  .brand h1 { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .toast { animation: none; } }
</style>
</head>
<body>

<div id="arena">
<canvas id="stage" aria-label="対戦スタジアム"></canvas>

<div class="hud" id="hud" hidden>
  <div class="side" id="hudMe"><span class="g" id="hudYou" style="color:var(--you)">龍</span><div class="spin"><i id="spinYou" style="background:var(--you)"></i></div></div>
  <div id="timer">60</div>
  <div class="foes" id="hudFoes"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="skillbar" id="skillBar" hidden>
  <button class="go" id="skillBtn" type="button">スキル</button>
</div>

<div class="launch" id="launch" hidden>
  <div class="label" id="launchMsg">ゲージが右端近くで止まるほど強く回ります</div>
  <div class="gauge"><i id="gaugeFill"></i></div>
  <button class="go" id="shoot" type="button">シュート</button>
</div>

<div class="result" id="result" hidden>
  <div class="card" role="dialog" aria-labelledby="verdict">
    <div class="verdict" id="verdict">勝</div>
    <div class="reason" id="reason"></div>
    <div class="streak" id="resStreak"></div>
    <div class="row">
      <button class="go" id="next" type="button">次の相手</button>
    </div>
    <div class="row">
      <button class="ghost" id="again" type="button">同じ相手と再戦</button>
      <button class="ghost" id="change" type="button">字を選びなおす</button>
    </div>
  </div>
</div>
</div>

<section class="sheet" id="setup" aria-label="コマの設定">
  <div class="col">
  <div class="brand"><h1>文字ゴマ道場</h1><small>一文字で回せ</small></div>
  <div class="pick">
    <div class="charbox">
      <label class="label" for="charInput">文字</label>
      <input id="charInput" type="text" value="龍" autocomplete="off" spellcheck="false" inputmode="text">
      <canvas id="preview" width="184" height="184" aria-label="形の解析（白が文字、橙の点が重心）"></canvas>
    </div>
    <div class="stats" id="stats">
      <span class="label">性能</span>
      <div class="stat"><b>重さ</b><div class="bar"><i id="b-mass"></i></div><span id="v-mass">–</span></div>
      <div class="stat"><b>攻撃</b><div class="bar"><i id="b-atk"></i></div><span id="v-atk">–</span></div>
      <div class="stat"><b>持久</b><div class="bar"><i id="b-sta"></i></div><span id="v-sta">–</span></div>
      <div class="stat"><b>安定</b><div class="bar"><i id="b-bal"></i></div><span id="v-bal">–</span></div>
      <div class="raw" id="raw">面積 –　半径 –　偏り –</div>
    </div>
  </div>
  <div class="shape">
    <span class="label">形を変える（上下左右に倒す・回す・反転する）</span>
    <div class="fonts" role="group" aria-label="文字の形" id="shapeBtns">
      <button class="chip" type="button" data-xf="up" aria-label="上に倒す">↑</button>
      <button class="chip" type="button" data-xf="down" aria-label="下に倒す">↓</button>
      <button class="chip" type="button" data-xf="left" aria-label="左に倒す">←</button>
      <button class="chip" type="button" data-xf="right" aria-label="右に倒す">→</button>
      <button class="chip" type="button" data-xf="ccw" aria-label="左に90度回す">⟲</button>
      <button class="chip" type="button" data-xf="cw" aria-label="右に90度回す">⟳</button>
      <button class="chip" type="button" data-xf="flipv" aria-label="上下反転">⇅ 上下反転</button>
      <button class="chip" type="button" data-xf="fliph" aria-label="左右反転">⇆ 左右反転</button>
      <button class="chip" type="button" data-xf="reset">戻す</button>
    </div>
    <p class="note" id="shapeDesc">そのまま</p>
  </div>
  <div class="fonts" role="group" aria-label="書体" id="fonts"></div>
  <div class="skillpick">
    <span class="label">スキル（1つ選んで、対戦中にボタンで使う）</span>
    <div class="fonts" id="skills" role="group" aria-label="スキル"></div>
    <p class="note" id="skillDesc"></p>
  </div>
  <div class="skillpick">
    <span class="label">パッシブ（ボタン不要。条件がそろうと自動で働く）</span>
    <div class="fonts" id="passives" role="group" aria-label="パッシブスキル"></div>
    <p class="note" id="passiveDesc"></p>
  </div>
  <p class="msg" id="msg" role="status"></p>
  </div>
  <div class="col">
  <div class="tabs" role="tablist" aria-label="対戦の種類">
    <button class="tab" id="tabCpu" role="tab" type="button" aria-selected="true">CPUと対戦</button>
    <button class="tab" id="tabOnline" role="tab" type="button" aria-selected="false">オンライン</button>
  </div>

  <div class="pane" id="paneCpu">
    <div class="cpuhead">
      <span class="label">CPUの数</span>
      <div class="fonts" id="cpuCount" role="group" aria-label="CPUの数"></div>
    </div>
    <div class="foe">
      <div class="cpulist" id="cpuList"></div>
      <button class="ghost" id="reroll" type="button">替える</button>
    </div>
    <button class="go" id="start" type="button">対戦する</button>
    <div class="streak" id="streak">連勝 0　この文字の最高 0</div>
  </div>

  <div class="pane" id="paneOnline" hidden>
    <div id="onOut">
      <p class="note">ルームを作って番号を相手に伝えると、同じページを開いた人と対戦できます。</p>
      <div class="namerow">
        <label class="label" for="nameIn">名前（ルームの中で表示されます）</label>
        <input id="nameIn" type="text" maxlength="12" placeholder="12文字まで" autocomplete="off" spellcheck="false" enterkeyhint="done">
      </div>
      <button class="go" id="mkRoom" type="button" disabled>ルームを作る</button>
      <div class="joinrow">
        <label class="sr" for="codeIn">ルーム番号</label>
        <input id="codeIn" type="text" placeholder="ルーム番号" maxlength="4" autocomplete="off" spellcheck="false" autocapitalize="characters">
        <button class="ghost" id="joinRoom" type="button" disabled>参加</button>
      </div>
    </div>
    <div id="onIn" hidden>
      <div class="codeline">
        <span class="label">ルーム番号</span>
        <code id="codeOut">----</code>
        <button class="ghost" id="copyCode" type="button">コピー</button>
      </div>
      <div class="members" id="members" aria-label="参加者"></div>
      <p class="readystatus" id="readyStatus" role="status"></p>
      <div class="row">
        <button class="go" id="readyBtn" type="button" disabled aria-pressed="false">準備OK にする</button>
        <button class="ghost" id="leaveRoom" type="button">退出</button>
      </div>
      <div class="streak" id="onRecord">この部屋の成績 0勝 0敗</div>
      <div class="chat" id="chat">
        <div class="chatlog" id="chatLog" aria-live="polite" aria-label="チャット"></div>
        <form class="chatform" id="chatForm" autocomplete="off">
          <label class="sr" for="chatIn">メッセージ</label>
          <input id="chatIn" type="text" maxlength="50" autocomplete="off" placeholder="メッセージ（50文字まで）" enterkeyhint="send">
          <button class="ghost" id="chatSend" type="submit">送信</button>
        </form>
      </div>
    </div>
    <p class="note" id="onMsg" role="status">接続しています…</p>
  </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';

// ───────── 書体 ─────────
const FONTS = [
  { id: 'gothic', name: 'ゴシック', css: '900 {S}px "Noto Sans JP", "Hiragino Sans", sans-serif', fam: 'Noto Sans JP', w: 900 },
  { id: 'mincho', name: '明朝', css: '900 {S}px "Noto Serif JP", "Hiragino Mincho ProN", serif', fam: 'Noto Serif JP', w: 900 },
  { id: 'maru', name: '丸ゴシック', css: '900 {S}px "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif', fam: 'Zen Maru Gothic', w: 900 },
  { id: 'pop', name: '極太', css: '400 {S}px "Dela Gothic One", "Hiragino Sans", sans-serif', fam: 'Dela Gothic One', w: 400 },
  { id: 'brush', name: '筆', css: '400 {S}px "Yuji Syuku", "Hiragino Mincho ProN", serif', fam: 'Yuji Syuku', w: 400 },
];
const fontById = id => FONTS.find(f => f.id === id) || FONTS[0];

async function ensureFont(font, ch) {
  try {
    await Promise.race([
      document.fonts.load(`${font.w} 100px "${font.fam}"`, ch),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) { /* 代替書体で続行 */ }
}

// ───────── 形の解析 ─────────
// 文字を256px角に描き、64×64の格子に落として物理量を求める。1格子 = 2/64 単位（コマ全体で直径2）。
const TEX = 256, N = 64, CELL = 2 / N;

// 文字を手前・奥・左右に倒したように見せる（遠い側が小さくなる遠近つき）。deg は倒す角度
function tiltCanvas(src, deg, vertical) {
  if (!deg) return src;
  const out = document.createElement('canvas'); out.width = out.height = TEX;
  const o = out.getContext('2d');
  const a = deg * Math.PI / 180, squash = Math.cos(a), k = Math.sin(a) * .35;
  const len = TEX * squash, start = (TEX - len) / 2, rows = Math.ceil(len);
  for (let i = 0; i < rows; i++) {
    const v = i / len;                                  // 0：上（左）端 〜 1：下（右）端
    const sc = (1 + k * (2 * v - 1)) / (1 + Math.abs(k)); // 倒した側ほど小さく
    const w = TEX * sc, srcPos = v * TEX, srcLen = Math.max(1, TEX / len);
    if (vertical) o.drawImage(src, 0, srcPos, TEX, srcLen, (TEX - w) / 2, start + i, w, 1);
    else o.drawImage(src, srcPos, 0, srcLen, TEX, start + i, (TEX - w) / 2, 1, w);
  }
  return out;
}
// 鏡に映したように反転する（fx：左右、fy：上下）
function flipCanvas(src, fx, fy) {
  if (!fx && !fy) return src;
  const out = document.createElement('canvas'); out.width = out.height = TEX;
  const o = out.getContext('2d');
  o.translate(fx ? TEX : 0, fy ? TEX : 0); o.scale(fx ? -1 : 1, fy ? -1 : 1); o.drawImage(src, 0, 0);
  return out;
}
function turnCanvas(src, quarter) {
  if (!quarter) return src;
  const out = document.createElement('canvas'); out.width = out.height = TEX;
  const o = out.getContext('2d');
  o.translate(TEX / 2, TEX / 2); o.rotate(quarter * Math.PI / 2); o.drawImage(src, -TEX / 2, -TEX / 2);
  return out;
}
const XF0 = { rx: 0, ry: 0, rz: 0, fx: false, fy: false };
const xfKey = xf => `${xf.rx},${xf.ry},${xf.rz},${xf.fx ? 1 : 0},${xf.fy ? 1 : 0}`;
// xf：{ rx：上下に倒す角度, ry：左右に倒す角度, rz：90度単位の回転, fx：左右反転, fy：上下反転 }
function analyzeGlyph(ch, fontId, xf = XF0) {
  const font = fontById(fontId);
  const c0 = document.createElement('canvas'); c0.width = c0.height = TEX;
  const x = c0.getContext('2d');
  const size = 210;
  x.font = font.css.replace('{S}', size);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  const m = x.measureText(ch);
  const L = m.actualBoundingBoxLeft || 0, R = m.actualBoundingBoxRight || m.width;
  const A = m.actualBoundingBoxAscent || size * .8, D = m.actualBoundingBoxDescent || 0;
  // インクの外接矩形の中心を軸（芯）に合わせる
  const ox = TEX / 2 - (R - L) / 2, oy = TEX / 2 + (A - D) / 2;
  x.fillStyle = '#fff';
  x.fillText(ch, ox, oy);
  const c = turnCanvas(tiltCanvas(tiltCanvas(flipCanvas(c0, xf.fx, xf.fy), xf.rx, true), xf.ry, false), xf.rz);

  const data = c.getContext('2d').getImageData(0, 0, TEX, TEX).data;
  const mask = new Uint8Array(N * N);
  const s = TEX / N;
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
    let sum = 0;
    for (let yy = 0; yy < s; yy += 2) for (let xx = 0; xx < s; xx += 2)
      sum += data[((gy * s + yy) * TEX + gx * s + xx) * 4 + 3];
    mask[gy * N + gx] = sum / ((s / 2) * (s / 2)) > 110 ? 1 : 0;
  }
  let cnt = 0, sx = 0, sz = 0, I = 0, maxR = 0;
  const edge = [];
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
    if (!mask[gy * N + gx]) continue;
    const lx = (gx - N / 2 + .5) * CELL, lz = (gy - N / 2 + .5) * CELL;
    cnt++; sx += lx; sz += lz;
    const r2 = lx * lx + lz * lz; I += r2; maxR = Math.max(maxR, Math.sqrt(r2));
    const nb = (gx > 0 && mask[gy * N + gx - 1]) + (gx < N - 1 && mask[gy * N + gx + 1]) +
               (gy > 0 && mask[(gy - 1) * N + gx]) + (gy < N - 1 && mask[(gy + 1) * N + gx]);
    if (nb < 4) edge.push(lx, lz);
  }
  const dA = CELL * CELL;
  const area = cnt * dA;                       // 面積（単位²）
  const cx = cnt ? sx / cnt : 0, cz = cnt ? sz / cnt : 0;
  const ecc = Math.hypot(cx, cz);              // 重心のずれ
  const mass = area;                           // 厚み・密度一定なので質量 ∝ 面積
  const inertia = I * dA + 0.02;               // 慣性モーメント（芯の分を少し足す）
  const round = maxR > 0 ? area / (Math.PI * maxR * maxR) : 0; // 外接円をどれだけ埋めているか
  // 当たり判定用の輪郭点（多すぎる場合は間引く）
  let pts = edge;
  if (edge.length / 2 > 360) {
    const step = Math.ceil(edge.length / 2 / 360); pts = [];
    for (let i = 0; i < edge.length; i += 2 * step) pts.push(edge[i], edge[i + 1]);
  }
  return { ch, fontId, xf, canvas: c, mask, cells: cnt, area, mass, inertia, maxR: Math.max(maxR, .2), round, ecc, cx, cz, pts: new Float32Array(pts) };
}

function insideMask(g, lx, lz) {
  const gx = Math.floor(lx / CELL + N / 2), gy = Math.floor(lz / CELL + N / 2);
  if (gx < 0 || gy < 0 || gx >= N || gy >= N) return false;
  return g.mask[gy * N + gx] === 1;
}

// 性能表示で「重さ100」にあたる質量（「踏ん張り」はこの重さまで引き上げる）
const MASS_100 = 1.9;
// 画面表示用の0〜100の指標（物理計算は生の値を直接使う）
const clamp01 = v => Math.max(0, Math.min(1, v));
function ratings(g) {
  return {
    mass: Math.round(clamp01(g.mass / MASS_100) * 100),
    atk: Math.round(clamp01((1 - g.round) * 1.15 + (g.maxR - .85) * .8) * 100),
    sta: Math.round(clamp01(1 - spinDecayRate(g, 45) / 2.4) * 100),
    bal: Math.round(clamp01(1 - g.ecc / .18) * 100),
  };
}

// ───────── 物理 ─────────
const ARENA_R = 5.5, BOWL_K = 0.045, G = 9.8;
const POCKETS = [Math.PI / 2, Math.PI / 2 + 2.094, Math.PI / 2 + 4.189];
const POCKET_W = 0.30;  // 場外ポケットの半角（ラジアン）
// 壁は対戦中ゆっくり回る（ポケットの位置も一緒に動く）。phase は今の回転角
const WALL_SPEED = 0.35;   // ラジアン／秒
const WALL = { phase: 0 };
const OMEGA_MIN = 7, MATCH_TIME = 60;
const height = r => BOWL_K * r * r;

// 回転の減り方（rad/s²）。床との摩擦は I が大きいほど効きにくく、
// 空気抵抗は形がギザギザなほど、偏りは重心が軸から遠いほど大きい。
function spinDecayRate(g, w) {
  const friction = 0.16 * g.mass / g.inertia;
  const air = (0.008 + 0.016 * (1 - g.round)) * w;
  const wobble = 0.12 * g.ecc * w;
  return friction + air + wobble;
}

// angle：打ち出す向き（ラジアン。x軸から z軸へ回る向きが正）。省略時は中心を左回りに回り込む向き
function makeTop(g, x, z, power, side, angle, skill, passive) {
  const pv = PASSIVES[passive] ? passive : 'none';
  const w0 = (34 + 30 * power) * (pv === 'heavy' ? .9 : 1);
  const sp = 2.5 + 3 * power;
  let vx, vz;
  if (typeof angle === 'number' && isFinite(angle)) {
    vx = Math.cos(angle) * sp; vz = Math.sin(angle) * sp;
  } else {
    const r = Math.hypot(x, z) || 1;
    vx = -z / r * sp - x / r * .8; vz = x / r * sp - z / r * .8;
  }
  const sk = SKILLS[skill] ? skill : 'dash';
  return { g, side, x, z, vx, vz, th: 0, w: w0, w0,
           state: 'spin', y: 0, tilt: 0, prec: 0, fall: 0,
           skill: sk, cdUntil: SKILLS[sk].after || 1, uses: SKILLS[sk].uses || Infinity, guard: 0, dash: 0, hyper: 0,
           steer: 0, boost: 0, boostAdd: 0, passive: pv, massK: pv === 'heavy' ? 1.3 : 1, revived: false, gutsUsed: false, evt: null };
}

function stepTop(t, dt) {
  if (t.state === 'out') {
    t.vy = (t.vy || 0) - G * dt; t.y += t.vy * dt;
    t.x += t.vx * dt; t.z += t.vz * dt; t.th += t.w * dt;
    return;
  }
  if (t.state === 'down') {
    t.vx *= Math.exp(-4 * dt); t.vz *= Math.exp(-4 * dt);
    t.x += t.vx * dt; t.z += t.vz * dt;
    t.w *= Math.exp(-3 * dt); t.th += t.w * dt;
    t.fall = Math.min(1, t.fall + dt * 2.5);
    return;
  }
  if (t.guard > 0) t.guard -= dt;
  if (t.dash > 0) t.dash -= dt;
  if (t.steer > 0) t.steer -= dt;
  if (t.boost > 0) {
    t.boost -= dt;
    // スピンブーストが切れたら、上乗せした分の半分だけ回転を戻す（ただし半分より下にはしない）
    if (t.boost <= 0) { t.w = Math.max(t.w - t.boostAdd * .5, t.w * .5); t.boostAdd = 0; }
  }
  const hyper = t.hyper > 0;
  const r = Math.hypot(t.x, t.z) || 1e-6;
  const sr = clamp01(t.w / t.w0);
  // すり鉢の傾斜で中心へ
  let ax = -G * 2 * BOWL_K * t.x, az = -G * 2 * BOWL_K * t.z;
  // 回転と床の摩擦で、すり鉢を周回する流れ（ギザギザな形ほど床をつかんで暴れる）
  // 進行方向を少しずつ曲げるので、中央を何度も横切る花びら状の軌跡になる
  const drift = (0.8 + 2.4 * (1 - t.g.round)) * sr;
  const vs = Math.hypot(t.vx, t.vz) || 1;
  ax += -t.vz / vs * drift; az += t.vx / vs * drift;
  // 遅くなりすぎないよう、回転が床を蹴って進む力
  if (vs < 2.2 * sr) { ax += t.vx / vs * 1.5 * sr; az += t.vz / vs * 1.5 * sr; }
  // 回転が弱るとふらつく
  const wob = hyper ? 0 : (1 - sr) * (1.5 + 6 * t.g.ecc);   // ハイパー無敵中はふらつかない（安定が最大）
  ax += Math.cos(t.th * .5) * wob; az += Math.sin(t.th * .5) * wob;
  t.vx += ax * dt; t.vz += az * dt;
  const damp = Math.exp(-0.6 * dt);
  t.vx *= damp; t.vz *= damp;
  const sp = Math.hypot(t.vx, t.vz);
  if (sp > 14) { t.vx *= 14 / sp; t.vz *= 14 / sp; }
  t.x += t.vx * dt; t.z += t.vz * dt;

  // 壁とポケット
  const r2 = Math.hypot(t.x, t.z);
  const ang = Math.atan2(t.z, t.x);
  const inPocket = POCKETS.some(p0 => { const p = p0 + WALL.phase; return Math.abs(Math.atan2(Math.sin(ang - p), Math.cos(ang - p))) < POCKET_W; });
  const reach = t.g.maxR * .75;
  if (inPocket && !hyper) {   // ハイパー無敵中はポケットも壁として跳ね返る
    if (r2 > ARENA_R + (t.passive === 'rubber' ? 1 : .15)) {   // ゴム壁は縁で粘る
      if (t.passive === 'revive' && !t.revived) {
        // パッシブ「リスポーン」：1回だけ、落ちる前と同じ回転のまま中央付近に戻る
        t.revived = true;
        const a = Math.random() * Math.PI * 2;
        t.x = Math.cos(a) * .8; t.z = Math.sin(a) * .8; t.vx = t.vz = 0;
        t.evt = 'revive';
      } else { t.state = 'out'; t.vy = 1; t.reason = '場外'; }
    }
  } else if (r2 + reach > ARENA_R) {
    const nx = t.x / r2, nz = t.z / r2;
    const vn = t.vx * nx + t.vz * nz;
    if (vn > 0) {
      const rubber = t.passive === 'rubber';
      t.vx -= (rubber ? 2 : 1.65) * vn * nx; t.vz -= (rubber ? 2 : 1.65) * vn * nz;
      if (rubber) t.w = Math.min(t.w0, t.w + t.w0 * .03);   // パッシブ「ゴム壁」：壁に当たるたびに回転を3%取り戻す
      // 壁との擦れで回転を失い、横に弾かれる。壁が回っているので、その向きにも少し押される
      t.vx += -nz * (t.w * .02 + WALL_SPEED * ARENA_R * .25); t.vz += nx * (t.w * .02 + WALL_SPEED * ARENA_R * .25);
      if (!hyper && !rubber) t.w -= Math.min(t.w * .06, vn * 1.2);   // パッシブ「ゴム壁」は壁で回転を失わない
      t.hitWall = vn;
    }
    t.x = nx * (ARENA_R - reach); t.z = nz * (ARENA_R - reach);
  }

  // パッシブ「吸収回転」は回転の減りが1.6倍、「重装」は1.1倍
  const drainK = t.passive === 'drain' ? 1.6 : t.passive === 'heavy' ? 1.1 : lowComeback(t) ? .7 : 1;
  t.w -= spinDecayRate(t.g, t.w) * drainK * dt;   // ハイパー無敵中も回転は自然に減っていく
  t.th += t.w * dt;
  if (t.w < OMEGA_MIN) {
    if (t.passive === 'guts' && !t.gutsUsed) {
      // パッシブ「根性」：場外以外で倒れるとき、1回だけスタミナ1割で踏みとどまる
      t.gutsUsed = true; t.w = OMEGA_MIN + (t.w0 - OMEGA_MIN) * .1; t.evt = 'guts';
    } else { t.state = 'down'; t.reason = 'スピンアウト'; }
  }
}

const _hits = [];
function collide(a, b) {
  if (a.state !== 'spin' || b.state !== 'spin') return;
  let dx = a.x - b.x, dz = a.z - b.z;
  const d = Math.hypot(dx, dz);
  if (d > a.g.maxR + b.g.maxR) return;
  let sx = 0, sz = 0, cnt = 0;
  const probe = (p, q) => {
    const cp = Math.cos(p.th), sp = Math.sin(p.th), cq = Math.cos(q.th), sq = Math.sin(q.th);
    const pts = p.g.pts;
    for (let i = 0; i < pts.length; i += 2) {
      const lx = pts[i], lz = pts[i + 1];
      const wx = p.x + lx * cp + lz * sp, wz = p.z - lx * sp + lz * cp;
      const rx = wx - q.x, rz = wz - q.z;
      if (insideMask(q.g, rx * cq - rz * sq, rx * sq + rz * cq)) { sx += wx; sz += wz; cnt++; }
    }
  };
  probe(a, b); probe(b, a);
  if (!cnt) return;
  const cx = sx / cnt, cz = sz / cnt;
  let nx = d > 1e-5 ? dx / d : 1, nz = d > 1e-5 ? dz / d : 0;
  // 「踏ん張り」中は重さが100（MASS_100）になる。回転の粘りも同じ割合で増える
  const ka = kOf(a), kb = kOf(b);
  const ma = a.g.mass * ka, mb = b.g.mass * kb, Ia = a.g.inertia * ka, Ib = b.g.inertia * kb;
  // めり込みを少しずつ解消
  const corr = Math.min(cnt * .0025, .06);
  a.x += nx * corr * mb / (ma + mb); a.z += nz * corr * mb / (ma + mb);
  b.x -= nx * corr * ma / (ma + mb); b.z -= nz * corr * ma / (ma + mb);

  const rax = cx - a.x, raz = cz - a.z, rbx = cx - b.x, rbz = cz - b.z;
  // 回転による接点の速度：ω × r（この座標系では (rz, -rx) 方向）
  const pax = raz, paz = -rax, pbx = rbz, pbz = -rbx;
  const vrx = (a.vx + a.w * pax) - (b.vx + b.w * pbx);
  const vrz = (a.vz + a.w * paz) - (b.vz + b.w * pbz);
  const vn = vrx * nx + vrz * nz;
  if (vn >= 0) return;
  const E = 1.0, MU = 0.6;
  // 見栄えのため、実際の剛体衝突より強めに弾く（ゲーム的な誇張）
  const BOOST = 1.8;
  const pan = pax * nx + paz * nz, pbn = pbx * nx + pbz * nz;
  const kn = 1 / ma + 1 / mb + pan * pan / Ia + pbn * pbn / Ib;
  const j = -(1 + E) * vn / kn;
  const tx = -nz, tz = nx;
  const vt = vrx * tx + vrz * tz;
  const pat = pax * tx + paz * tz, pbt = pbx * tx + pbz * tz;
  const kt = 1 / ma + 1 / mb + pat * pat / Ia + pbt * pbt / Ib;
  let jt = -vt / kt; jt = Math.max(-MU * j, Math.min(MU * j, jt));
  const Jx = (nx * j + tx * jt) * BOOST, Jz = (nz * j + tz * jt) * BOOST;
  // 「ダッシュ」中のコマにぶつけられた側は2倍強く弾かれる
  // 「ハイパー無敵」中のコマにぶつけられた側も同じく2倍（攻撃が最大）
  // パッシブ「逆境」：スタミナ3割未満のとき、ぶつけた相手を1.5倍強く弾く
  const da = hitPower(b), db = hitPower(a);
  const wa0 = a.w, wb0 = b.w;
  const ta = takeK(a), tb = takeK(b);
  a.vx += Jx / ma * da * ta; a.vz += Jz / ma * da * ta; b.vx -= Jx / mb * db * tb; b.vz -= Jz / mb * db * tb;
  a.w += (pax * Jx + paz * Jz) / Ia; b.w -= (pbx * Jx + pbz * Jz) / Ib;
  // 逆回転にはならない（ぶつかって止まるだけ）
  a.w = Math.max(0, a.w); b.w = Math.max(0, b.w);
  // ハイパー無敵中は、ぶつかっても自分の回転は減らない
  if (a.hyper > 0) a.w = Math.max(a.w, wa0);
  if (b.hyper > 0) b.w = Math.max(b.w, wb0);
  // ダッシュ中はぶつかって減る回転が半分、踏ん張り中は7割になる
  if (a.guard > 0 && !(a.dash > 0) && a.w < wa0) a.w = wa0 - (wa0 - a.w) * .7;
  if (b.guard > 0 && !(b.dash > 0) && b.w < wb0) b.w = wb0 - (wb0 - b.w) * .7;
  if (a.dash > 0 && a.w < wa0) a.w = wa0 - (wa0 - a.w) * .5;
  if (b.dash > 0 && b.w < wb0) b.w = wb0 - (wb0 - b.w) * .5;
  // パッシブ「吸収回転」：ぶつかるたびに回転を最大の6%取り戻す
  for (const t of [a, b]) if (t.passive === 'drain' && j * BOOST > .4) t.w = Math.min(t.w0 * (t.boostAdd ? 1.8 : 1), t.w + t.w0 * .06);
  _hits.push({ x: cx, z: cz, j: j * BOOST });
}

// 発射位置：人数に応じて円周上に等間隔に並べる（2人なら左手前と右奥）
const START_R = 3.4;
function startPos(i, n) {
  const a = Math.PI - .36 + i * Math.PI * 2 / n;

  o.connect(gn).connect(audio.destination); o.start(t); o.stop(t + .16);
}

function placeMesh(m, t) {
  const r = Math.hypot(t.x, t.z);
  m.root.position.set(t.x, height(Math.min(r, ARENA_R)) + t.y, t.z);
  m.spin.rotation.y = t.th;
  const sr = clamp01(t.w / t.w0);
  t.prec += (2 + 6 * (1 - sr)) / 60;
  let tilt = .03 + .3 * Math.pow(1 - sr, 2) + t.g.ecc * .5;
  if (t.state === 'down') tilt = tilt + (1.25 - tilt) * t.fall;
  m.tilt.rotation.set(Math.cos(t.prec) * tilt, 0, Math.sin(t.prec) * tilt);
}

function resize() {
  const box = document.getElementById('arena');
  const w = box.clientWidth || window.innerWidth, h = box.clientHeight || window.innerHeight;
  if (renderer) { renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.setSize(w, h, false); }
  camera.aspect = w / h;
  // スタジアム全体（直径約13）が横幅に収まる距離をとる
  const fitH = 7.6 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fitW = fitH / Math.min(1, camera.aspect);
  const dist = Math.max(13, fitW * .95);
  camera.position.set(0, dist * .78, dist * .62);
  camera.lookAt(0, 0, 0);
  scene.fog.near = dist * 1.1; scene.fog.far = dist * 2.2;
  camera.updateProjectionMatrix();
}

// 形の変え方（倒す角度は15度刻みで±60度まで、回転は90度単位）。ほかの人から届いた値にも使う
function cleanXf(v) {
  const st = n => (typeof n === 'number' && isFinite(n)) ? Math.max(-60, Math.min(60, Math.round(n / 15) * 15)) : 0;
  if (!v || typeof v !== 'object') return { ...XF0 };
  return { rx: st(v.rx), ry: st(v.ry), rz: (typeof v.rz === 'number' && isFinite(v.rz)) ? ((Math.round(v.rz) % 4) + 4) % 4 : 0,
    fx: v.fx === true, fy: v.fy === true };
}

function shapeText(xf) {
  const parts = [];
  if (xf.rx) parts.push(`${xf.rx > 0 ? '上' : '下'}に${Math.abs(xf.rx)}°`);
  if (xf.ry) parts.push(`${xf.ry > 0 ? '左' : '右'}に${Math.abs(xf.ry)}°`);
  let t = parts.length ? parts.join('・') + '倒す' : '';
  if (xf.rz) t += (t ? '・' : '') + `${xf.rz * 90}°回転`;
  if (xf.fy) t += (t ? '・' : '') + '上下反転';
  if (xf.fx) t += (t ? '・' : '') + '左右反転';
  return t || 'そのまま';
}
function changeShape(op) {
  const xf = { ...S.xf };
  if (op === 'up') xf.rx += 15; if (op === 'down') xf.rx -= 15;
  if (op === 'left') xf.ry += 15; if (op === 'right') xf.ry -= 15;
  if (op === 'cw') xf.rz += 1; if (op === 'ccw') xf.rz += 3;
  if (op === 'flipv') xf.fy = !xf.fy; if (op === 'fliph') xf.fx = !xf.fx;
  S.xf = op === 'reset' ? { ...XF0 } : cleanXf(xf);
  store.set('mg.xf', S.xf);
  refreshGlyph();
}

function drawPreview(g) {
  const c = $('preview'), x = c.getContext('2d'), W = c.width, cs = W / N;
  x.clearRect(0, 0, W, W);
  // 外接円
  x.strokeStyle = 'rgba(154,163,192,.35)'; x.setLineDash([4, 4]);
  x.beginPath(); x.arc(W / 2, W / 2, g.maxR / CELL * cs, 0, Math.PI * 2); x.stroke(); x.setLineDash([]);
  x.fillStyle = '#efe9da';
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) if (g.mask[gy * N + gx]) x.fillRect(gx * cs, gy * cs, cs + .3, cs + .3);
  // 軸（金）と重心（橙）
  x.fillStyle = '#d9a441'; x.beginPath(); x.arc(W / 2, W / 2, 5, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#e9724c'; x.beginPath(); x.arc(W / 2 + g.cx / CELL * cs, W / 2 + g.cz / CELL * cs, 5, 0, Math.PI * 2); x.fill();
}

let glyphToken = 0;
async function refreshGlyph() {
  const raw = $('charInput').value.trim();
  const ch = Array.from(raw)[0] || '';
  const token = ++glyphToken;
  if (!ch) { $('msg').textContent = '文字を一つ入力してください。'; S.g = null; updateButtons(); return; }
  // 2文字以上入力されても欄の中身は変えず、1文字目をコマにする（日本語の変換途中を壊さないため）
  fitCharInput();
  await ensureFont(fontById(S.font), ch);
  if (token !== glyphToken) return;
  const g = analyzeGlyph(ch, S.font, S.xf);
  $('shapeDesc').textContent = shapeText(S.xf);
  if (g.cells < 30) {
    $('msg').textContent = 'この文字は形がほとんどないため、コマにできません。';
    S.g = null; updateButtons(); return;
  }
  $('msg').textContent = Array.from(raw).length > 1 ? `1文字目の「${ch}」をコマにします。` : '';
  if (ch !== S.ch) S.streak = 0;
  S.ch = ch; S.g = g; store.set('mg.ch', ch);

}

let cpuToken = 0;
async function rerollCpus() {
  const token = ++cpuToken;
  const used = new Set(S.cpus.map(c => c.ch));

  while (list.length < S.cpuN) {
    const ch = CPU_POOL[Math.floor(Math.random() * CPU_POOL.length)];

    list.push({ ch, font: FONTS[Math.floor(Math.random() * FONTS.length)].id, skill: SKILL_IDS[Math.floor(Math.random() * SKILL_IDS.length)],
      passive: PASSIVE_IDS[Math.floor(Math.random() * PASSIVE_IDS.length)], g: null });

  S.cpus = list;
  renderCpuList();
  await Promise.all(list.map(async c => { await ensureFont(fontById(c.font), c.ch); c.g = analyzeGlyph(c.ch, c.font); }));
  if (token === cpuToken) updateButtons();
}

}

// ゲージは88%付近が最大。行き過ぎると弱くなる
const gaugePower = () => clamp01(1 - Math.abs(S.gauge - .88) / .88);

// CPU は誰か1人を選んで、そのあたりを狙う
function cpuAim(i, n) {
  let j;
  do { j = Math.floor(Math.random() * n); } while (j === i);
  const [x, z] = startPos(i, n), [tx, tz] = startPos(j, n);
  return Math.atan2(tz - z, tx - x) + (Math.random() - .5) * 1.2;
}

function startBattleMeshes() {
  clearBattleMeshes();
  S.meshes = S.players.map(p => buildTopMesh(p.g, p.color));
  S.mode = 'battle'; S.preview = null; S.aiAt = 0; S.skillLabel = '';
  $('launch').hidden = true;
  $('skillBar').hidden = false;
  $('skillBtn').disabled = true;
  $('skillBtn').textContent = SKILLS[S.players[S.myIdx].skill].name;
  $('skillBtn').focus({ preventScroll: true });
}

// 1回目のタップで強さ、2回目のタップで角度を決めて打ち出す
function shoot() {
  if (S.mode !== 'launch') return;
  if (S.stage === 'power') {
    S.lockedPower = gaugePower();
    S.stage = 'aim';
    aimArrow.visible = true;
    $('shoot').textContent = '角度を決めて打つ';
    $('launchMsg').textContent = '回る矢印が狙いの向きに来たら押します';
    return;
  }
  if (S.stage !== 'aim') return;
  S.stage = 'done';
  aimArrow.visible = false;
  const p = S.lockedPower, a = Math.round(S.aim * 1000) / 1000;
  if (S.kind === 'cpu') {
    const n = S.players.length;
    S.battle = newBattle(S.players.map((pl, i) => i === 0
      ? { g: pl.g, p, a, skill: pl.skill, passive: pl.passive }
      : { g: pl.g, p: .55 + Math.random() * .4, a: cpuAim(i, n), skill: pl.skill, passive: pl.passive }));
    startBattleMeshes();
    return;
  }
  if (ON.myShot != null) return;
  ON.myShot = { p, a };
  $('shoot').hidden = true;
  $('launchMsg').textContent = 'ほかの人のシュートを待っています';
  if (ON.role === 'host') hostTick();
  else ON.R.presence({ shot: { m: ON.m, p, a } }).catch(() => {});
}

// ── スキル ──
function pressSkill() {
  const B = S.battle;
  if (S.mode !== 'battle' || !B || B.over) return;
  if (B.remote) {
    // ゲストはホストに「使った」と伝えるだけ。使えるかどうかはホストが判定する
    const t = B.tops[S.myIdx];
    if (!t || t.state !== 'spin' || t.cdLeft > 0 || t.uses <= 0) return;
    ON.skN = (ON.skN || 0) + 1;
    ON.R.presence({ sk: { m: ON.m, n: ON.skN } }).catch(() => {});
    return;
  }
  useSkill(B, S.myIdx);
}

function updateSkillBtn() {
  const B = S.battle, t = B && B.tops[S.myIdx];
  if (!t) return;
  const id = S.players[S.myIdx].skill;
  const cdLeft = B.remote ? t.cdLeft : Math.max(0, t.cdUntil - B.t);
  const uses = B.remote ? t.uses : t.uses;
  const eff = B.remote ? (t.effLeft || 0) : Math.max(0, effectLeft(t));
  let label = SKILLS[id].name;
  if (eff >= EFFECT_FOREVER && t.state === 'spin') label += '　発動中（試合終了まで）';
  else if (eff > 0 && t.state === 'spin') label += id === 'steer' ? `　あと${eff.toFixed(1)}秒・画面をタップ` : `　発動中　あと${eff.toFixed(1)}秒`;
  else {
    if (SKILLS[id].uses) label += `　残り${uses}回`;
    if (cdLeft > 0 && uses > 0) label += `　${cdLeft.toFixed(1)}秒`;
  }
  const off = B.over || t.state !== 'spin' || cdLeft > 0 || uses <= 0;
  if (label !== S.skillLabel) { $('skillBtn').textContent = label; S.skillLabel = label; }
  $('skillBtn').disabled = off;
}

// ── 結果 ──

  if (t.state === 'out') return t.reason === '退出' ? '退出' : '場外';
  if (t.state === 'down') return 'スピンアウト';
  return '最後まで回っていました';
}

function finish() {
  const B = S.battle;
  S.mode = 'result';
  const n = S.players.length;
  const winIdx = B.winIdx | 0;
  const code = B.code || 'time';
  const win = winIdx === S.myIdx;
  const order = Array.isArray(B.order) && B.order.length === n ? B.order : [winIdx];
  let rank = order.indexOf(S.myIdx) + 1;
  if (rank <= 0) rank = n;
  let verdict, reason;
  if (n === 2) {
    verdict = win ? '勝' : '負';
    if (code === 'time') reason = '時間切れ（残り回転の割合で判定）';
    else if (code === 'left') reason = '相手が退出しました';
    else reason = `${win ? (S.players[1 - S.myIdx].name || '相手') : 'あなた'}の${REASON[code]}（${(B.overAt || 0).toFixed(1)}秒）`;
  } else if (win) {
    verdict = '勝';
    reason = code === 'time' ? '時間切れ（残り回転の割合で判定）で1位' : `最後まで回り続けました（${(B.overAt || 0).toFixed(1)}秒）`;
  } else {
    verdict = `${rank}位`;
    const wp = S.players[winIdx];
    reason = `${wp.name ? wp.name + '（' + wp.ch + '）' : '「' + wp.ch + '」'}の勝ち。あなたは${myReasonText(B)}`;
  }
  $('verdict').textContent = verdict;
  $('verdict').style.color = win ? 'var(--you)' : (S.players[winIdx] ? S.players[winIdx].css : 'var(--foe)');
  $('reason').textContent = reason;
  $('skillBar').hidden = true;
  if (S.kind === 'cpu') {
    if (win) {
      S.streak++;
      if (S.streak > store.get(streakKey(), 0)) store.set(streakKey(), S.streak);
    } else S.streak = 0;
    $('resStreak').textContent = `連勝 ${S.streak}　最高 ${store.get(streakKey(), 0)}`;
    $('next').textContent = win ? '次の相手' : '新しい相手で挑む';
    $('again').hidden = false;
  } else {
    ON.rec[win ? 'w' : 'l']++;
    if (ON.role === 'host') {
      ON.phase = 'result';
      ON.R.presence({ phase: 'result', res: { m: ON.m, w: winIdx, r: code, t: +(B.overAt || 0).toFixed(1) } }).catch(() => {});
    }
    $('resStreak').textContent = `この部屋の成績 ${ON.rec.w}勝 ${ON.rec.l}敗`;
    $('next').textContent = 'もう一度';
    $('again').hidden = true;
  }
  $('change').textContent = '字を選びなおす';
  $('result').hidden = false;
  $('next').focus();
}

function backToSetup() {

// ───────── チャット ─────────
// チャットも presence で運ぶ（各自が直近6件を自分の状態として載せ、ほかの人は未表示の分だけ出す）。
// claude.ai の閲覧のみの共有相手でも送れて、PeerJS 版でも同じ仕組みで動く。
const CHAT = { mine: [], seq: 0, seen: new Map(), known: new Map(), lastSend: 0 };
const CHAT_STRIP = /[\p{Cc}\p{Co}\p{Cs}­​‌‎‏‪-‮⁠-⁯﻿]/gu;
function cleanText(v) {
  if (typeof v !== 'string') return '';
  return Array.from(v.replace(CHAT_STRIP, '').replace(/\s+/g, ' ').trim()).slice(0, 50).join('');
}
function addChatLine(kind, text, label, css) {
  const log = $('chatLog');
  const row = document.createElement('div');
  row.className = 'line ' + kind;
  if (kind !== 'sys') {
    const b = document.createElement('b');
    b.textContent = kind === 'me' ? '自分' : label;
    if (css) b.style.color = css;
    row.append(b);
  }
  const sp = document.createElement('span'); sp.textContent = text; row.append(sp);
  log.append(row);
  while (log.children.length > 60) log.firstChild.remove();
  chatToBottom();
}
// チャットは常に最新の発言（最下部）を見せる。欄を移したり表示し直したりしても先頭に戻らないようにする
function chatToBottom() {
  const log = $('chatLog');
  log.scrollTop = log.scrollHeight;
  requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
}
if (window.ResizeObserver) new ResizeObserver(() => chatToBottom()).observe($('chatLog'));
function resetChat() {
  CHAT.mine = []; CHAT.seq = 0; CHAT.seen.clear(); CHAT.known.clear();
  $('chatLog').textContent = ''; $('chatIn').value = '';
}
function sendChat(e) {
  e.preventDefault();
  if (!ON.R) return;
  const t = cleanText($('chatIn').value);
  if (!t) return;
  const now = performance.now();
  if (now - CHAT.lastSend < 700) return;   // 連投しすぎないように
  CHAT.lastSend = now;
  CHAT.mine.push([++CHAT.seq, t]);
  if (CHAT.mine.length > 6) CHAT.mine.shift();
  ON.R.presence({ chat: CHAT.mine.slice() }).catch(() => {});
  addChatLine('me', t);
  $('chatIn').value = '';
}
function chatSync(others) {
  const now = new Set();
  for (const p of others) {
    const pr = p.presence || {};
    const ch = cleanName(pr.name) || '名無し';
    now.add(p.peer);
    if (!CHAT.known.has(p.peer)) addChatLine('sys', `${ch} さんが入室しました`);
    CHAT.known.set(p.peer, ch);
    const arr = pr.chat;
    if (!Array.isArray(arr)) continue;
    let seen = CHAT.seen.get(p.peer) || 0;
    for (const m of arr.slice(-6)) {
      if (!Array.isArray(m)) continue;
      const i = num(m[0], 0, 1e9, 0);
      if (i <= seen) continue;
      seen = i;
      const t = cleanText(m[1]);
      if (t) addChatLine('opp', t, ch, colorForPeer(p.peer));
    }
    CHAT.seen.set(p.peer, seen);
  }
  for (const [peer, ch] of CHAT.known) {
    if (!now.has(peer)) { addChatLine('sys', `${ch} さんが退出しました`); CHAT.known.delete(peer); CHAT.seen.delete(peer); }
  }
}
// 対戦中はスタジアムの上（HUD のすぐ下）へ、待機中はルームの欄へチャットを移す
const phoneMQ = window.matchMedia('(max-width: 640px)');
function placeChat() {
  const chat = $('chat');
  const playing = !!ON.R && S.mode !== 'idle';
  // スマホでは対戦中のチャットをスタジアムの下に置き、画面に重ねない
  const dock = playing && phoneMQ.matches;
  const floating = playing && !dock;
  chat.classList.toggle('float', floating);
  chat.classList.toggle('dock', dock);
  document.body.classList.toggle('chatdock', dock);
  if (dock) {
    chat.style.top = '';
    $('arena').after(chat);
  } else if (floating) {
    $('arena').insertBefore(chat, $('result'));
    const hud = $('hud');
    chat.style.top = hud.hidden ? '' : `${hud.offsetTop + hud.offsetHeight + 8}px`;
  } else {
    chat.style.top = '';
    $('onIn').append(chat);
  }
  chatToBottom();
}
if (phoneMQ.addEventListener) phoneMQ.addEventListener('change', () => { if (ON.R) placeChat(); });

// ───────── オンライン対戦 ─────────
// 同じルーム番号を開いた最大4人をつなぐ。claude.ai の中では room 機能、外では PeerJS を使う。
// ルームを作った人（ホスト）が物理計算を行い、結果の状態を presence で流す。
// 参加した人（ゲスト）は強さ・角度・スキルの使用を送り、届いた状態を描画する。
// presence は閲覧のみの共有相手でも送れるため、イベント送信の権限設定は不要。
const ON = {
  room: null, R: null, role: null, code: '', me: null, hostPeer: null,
  seats: [], members: [], glyphs: new Map(),
  ready: false, m: 0, phase: 'lobby', players: [], gone: new Set(), myShot: null,
  rec: { w: 0, l: 0 }, sentAt: 0, hitSeq: 0, seenHit: 0, evSeq: 0, seenEv: 0, hits: [], evs: [],
  skLast: new Map(), skPend: new Map(), stLast: new Map(), skN: 0, stN: 0, full: false,
};
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
// 通信の取り決めの版。ページを更新して中身が変わったら上げる（版が違う人どうしは試合を始められない）
const PROTO = 4;

// ほかの人から届く値はすべて信用せず、型と範囲を確かめてから使う
const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v)) ? Math.max(lo, Math.min(hi, v)) : d;
function cleanCh(v) {
  if (typeof v !== 'string') return null;
  const c = Array.from(v)[0];
  return c && !/[\s\p{C}]/u.test(c) ? c : null;
}
const cleanFont = v => FONTS.some(f => f.id === v) ? v : null;
const cleanSkill = v => SKILLS[v] ? v : 'dash';
// 名前：見えない文字や改行を除き、12文字まで
const cleanName = v => Array.from(cleanText(v)).slice(0, 12).join('');
function myName() { return cleanName($('nameIn').value); }

function onMsg(t) { $('onMsg').textContent = t; $('onMsg').hidden = !t; }

// claude.ai の外（GitHub Pages など）では PeerJS でブラウザどうしを直接つなぐ。
// ゲーム側からは claude.ai の room と同じ形（join / presence / peers / onPeers / leave）に見えるようにする。
// ゲストはホストとだけつながり、ホストが各ゲストの状態をほかのゲストへ中継する。
// 合図のやりとりには PeerJS の無料公開サーバー、つながりにくい回線では PeerJS の中継（TURN）サーバーが使われる。
function peerRoomAdapter() {
  if (typeof window.Peer !== 'function') return null;
  const opts = window.__PEER_OPTS || {};
  const okPres = p => p && typeof p === 'object' && !Array.isArray(p) && JSON.stringify(p).length <= 8192;
  return {
    join(name, role) {
      return new Promise((resolve, reject) => {
        const hostId = 'mojigoma-' + name;
        const peer = role === 'host' ? new Peer(hostId, opts) : new Peer(opts);
        const conns = new Map(), remote = new Map(), handlers = new Set();
        let pres = {}, snap = null, queued = false, settled = false, myId = null;
        let beat = null, bye = null;
        const fail = code => { if (!settled) { settled = true; clearInterval(beat); if (bye) window.removeEventListener('pagehide', bye); try { peer.destroy(); } catch (e) {} reject({ code }); } };
        const notify = () => {
          snap = null;
          if (queued) return; queued = true;
          requestAnimationFrame(() => { queued = false; const ps = R.peers(); handlers.forEach(h => h({ peers: ps, joined: [], left: [], updated: [] })); });
        };
        const sendTo = (c, msg) => { try { if (c.open) c.send(msg); } catch (e) { /* 切れかけの接続は無視 */ } };
        // 画面を閉じた人に気づけるよう、2秒ごとに合図を送り、8秒届かない相手は抜けたとみなす
        const lastSeen = new Map();
        beat = setInterval(() => {
          const now = Date.now();
          for (const [id, c] of conns) {
            sendTo(c, { t: 'hb' });
            if (now - (lastSeen.get(id) || now) > 8000) { try { c.close(); } catch (e) {} c.emit && c.emit('close'); }
          }
        }, 2000);
        bye = () => { try { peer.destroy(); } catch (e) {} };
        window.addEventListener('pagehide', bye);
        const attach = c => {
          c.on('open', () => {
            conns.set(c.peer, c); lastSeen.set(c.peer, Date.now());
            if (role === 'host') {
              // 新しいゲストに、ホストとほかのゲストの今の状態を渡す
              sendTo(c, { t: 'p', from: myId, p: pres });
              for (const [id, p] of remote) if (id !== c.peer) sendTo(c, { t: 'p', from: id, p });
            } else {
              sendTo(c, { t: 'p', p: pres });
              if (!settled) { settled = true; resolve(R); }
            }
            notify();
          });
          c.on('data', d => {
            lastSeen.set(c.peer, Date.now());
            if (!d || typeof d !== 'object' || d.t === 'hb') return;
            if (role === 'host') {
              // ゲストの名乗りは使わず、接続の相手をそのまま差出人とする
              if (d.t !== 'p' || !okPres(d.p)) return;
              const p = Object.freeze({ ...d.p });
              remote.set(c.peer, p);
              for (const [id, o] of conns) if (id !== c.peer) sendTo(o, { t: 'p', from: c.peer, p });
              notify();
            } else {
              if (typeof d.from !== 'string' || d.from === myId) return;
              if (d.t === 'p' && okPres(d.p)) { remote.set(d.from, Object.freeze({ ...d.p })); notify(); }
              if (d.t === 'bye') { remote.delete(d.from); notify(); }
            }
          });
          const drop = () => {
            if (!conns.has(c.peer)) return;
            conns.delete(c.peer); lastSeen.delete(c.peer);
            if (role === 'host') {
              remote.delete(c.peer);
              for (const o of conns.values()) sendTo(o, { t: 'bye', from: c.peer });
            } else remote.clear();   // ホストが抜けたら全員と切れる
            notify();
          };
          c.on('close', drop); c.on('error', drop);
        };
        const R = {
          name,
          presence(patch) {
            pres = { ...pres };
            for (const [k, v] of Object.entries(patch)) { if (v === null) delete pres[k]; else pres[k] = v; }
            const msg = role === 'host' ? { t: 'p', from: myId, p: pres } : { t: 'p', p: pres };
            conns.forEach(c => sendTo(c, msg)); notify();
            return Promise.resolve();
          },
          peers() {
            if (snap) return snap;
            return (snap = Object.freeze([
              { peer: myId, sameTab: true, isMe: true, kind: 'viewer', by: null, guest: false, presence: pres, updatedAt: Date.now() },
              ...[...remote.keys()].map(id => ({ peer: id, sameTab: false, isMe: false, kind: 'viewer', by: null, guest: false, presence: remote.get(id) || {}, updatedAt: Date.now() })),
            ]));
          },
          onPeers(h) { handlers.add(h); notify(); return () => handlers.delete(h); },
          leave() { clearInterval(beat); window.removeEventListener('pagehide', bye); bye(); return Promise.resolve(); },
        };
        peer.on('open', id => {
          myId = id; snap = null;
          if (role === 'host') { settled = true; resolve(R); }
          else attach(peer.connect(hostId, { reliable: true, serialization: 'json' }));
        });
        // 合図用サーバーとの接続が切れても、新しい参加者を受け付けられるようにつなぎ直す
        peer.on('disconnected', () => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} });
        peer.on('connection', c => { if (role === 'host' && conns.size < 8) attach(c); else c.close(); });
        peer.on('error', e => {
          const t = e && e.type;
          console.warn('PeerJS:', t, e && e.message);
          if (t === 'unavailable-id') fail('taken');
          else if (t === 'peer-unavailable') fail('no_room');
          else if (!settled) fail(t === 'browser-incompatible' ? 'unsupported' : 'network');
        });
        setTimeout(() => fail('timeout'), 15000);
      });
    },
  };
}

async function initRoom() {
  try { ON.room = (window.claude && window.claude.use) ? await window.claude.use('room') : null; }
  catch (e) { ON.room = null; }
  if (!ON.room) { ON.room = peerRoomAdapter(); ON.p2p = !!ON.room; }
  if (!ON.room) onMsg('この環境ではオンライン対戦を使えません。');
  else onMsg('');
  updateButtons();
}

async function enterRoom(code, role) {
  if (!ON.room || ON.R || (ON.joining && !ON.retry)) return;
  ON.joining = true; updateButtons();
  onMsg('ルームに入っています…');
  try { await joinRoom(code, role); } finally { ON.joining = false; updateButtons(); }
}

async function joinRoom(code, role) {
  try {
    ON.R = await ON.room.join('mg-' + code.toLowerCase(), role);
  } catch (e) {
    const c = e && e.code;
    if (c === 'taken' && role === 'host' && (ON.retry = (ON.retry || 0) + 1) < 4) return joinRoom(makeCode(), role);
    ON.retry = 0;
    onMsg(c === 'no_room' ? 'このルーム番号の部屋が見つかりません。番号を確かめるか、ホストがルームを開くのを待ってください。'
      : c === 'limit_reached' ? 'いまはルームを開けません。少し待ってからもう一度試してください。'
      : c === 'unsupported' ? 'このブラウザはオンライン対戦に対応していません。'
      : 'ルームに入れませんでした。通信状態を確かめて、もう一度試してください。');
    return;
  }
  ON.retry = 0;
  Object.assign(ON, { role, code, ready: false, m: 0, phase: 'lobby', players: [], gone: new Set(), myShot: null,
    hostPeer: null, seats: [], members: [], rec: { w: 0, l: 0 }, hitSeq: 0, seenHit: 0, evSeq: 0, seenEv: 0,
    hits: [], evs: [], skLast: new Map(), full: false });
  onMsg('');
  ON.unsubPeers = ON.R.onPeers(() => sync(), () => { onMsg('ルームとの接続が切れました。退出して入り直してください。'); });
  resetChat();
  ON.R.presence({ v: PROTO, chat: [], role, name: ON.name, deck: null, ready: false,
    phase: role === 'host' ? 'lobby' : null, m: 0, seats: [], players: [], shot: null, sk: null, st: null, s: null, res: null }).catch(() => {});
  updateRoomUI();
  // 番号違いに気づけるよう、しばらくホストが見つからなければ知らせる
  if (role === 'guest') setTimeout(() => { if (ON.R && !ON.hostPeer) onMsg('このルーム番号の部屋が見つかりません。番号を確かめるか、ホストがルームを開くのを待ってください。'); }, 4000);
}

async function leaveRoom() {
  const R = ON.R;
  if (!R) return;
  if (ON.unsubPeers) ON.unsubPeers();
  ON.R = null; ON.role = null; ON.members = []; ON.hostPeer = null;
  placeChat();
  try { await R.leave(); } catch (e) { /* すでに切れている */ }
  if (S.mode !== 'idle') backToSetup();
  onMsg('');
  updateRoomUI();
}

function makeCode() {
  let c = '';
  const a = new Uint32Array(4); crypto.getRandomValues(a);
  for (const v of a) c += CODE_CHARS[v % CODE_CHARS.length];
  return c;
}

// 文字の形の解析は時間がかかるので、文字と書体の組ごとに一度だけ行って覚えておく
function glyphFor(ch, font, xf = XF0) {
  const key = ch + '|' + font + '|' + xfKey(xf);
  if (ON.glyphs.has(key)) { const v = ON.glyphs.get(key); return v === 'loading' ? undefined : v; }
  ON.glyphs.set(key, 'loading');
  (async () => {
    await ensureFont(fontById(font), ch);
    const g = analyzeGlyph(ch, font, xf);
    ON.glyphs.set(key, g.cells >= 30 ? g : null);
    sync();
  })();
  return undefined;
}

function colorForPeer(peer) {
  const others = ON.members.filter(m => !m.me);
  const k = others.findIndex(m => m.peer === peer);
  return k >= 0 ? FOE_CSS[k % 3] : 'var(--muted)';
}

function sync() {
  if (!ON.R) return;
  const peers = ON.R.peers();
  const meP = peers.find(p => p.sameTab);
  ON.me = meP ? meP.peer : null;
  const others = peers.filter(p => !p.sameTab && p.presence && (p.presence.role === 'host' || p.presence.role === 'guest'));
  const byPeer = new Map(others.map(p => [p.peer, p]));
  let hostP = null;
  if (ON.role === 'host') {
    // 座席：いる人はそのまま、空いた席には来た順に座らせる（ホストのほかに3人まで）
    const guests = others.filter(p => p.presence.role === 'guest');
    const seats = ON.seats.filter(id => guests.some(g => g.peer === id));
    for (const g of guests) if (seats.length < MAX_PLAYERS - 1 && !seats.includes(g.peer)) seats.push(g.peer);
    if (seats.join() !== ON.seats.join()) { ON.seats = seats; ON.R.presence({ seats }).catch(() => {}); }
  } else {
    hostP = others.find(p => p.presence.role === 'host') || null;
    ON.seats = hostP && Array.isArray(hostP.presence.seats) ? hostP.presence.seats.filter(x => typeof x === 'string').slice(0, MAX_PLAYERS - 1) : [];
    ON.full = !!(hostP && ON.me && !ON.seats.includes(ON.me) && ON.seats.length >= MAX_PLAYERS - 1);
    if (ON.full) onMsg('このルームは満員（4人）です。別の番号で遊んでください。');
    else if (hostP) onMsg('');
    if (!hostP && ON.hostPeer) hostLeft();
    ON.hostPeer = hostP ? hostP.peer : null;
  }
  // 参加者の一覧（ホストが先頭、あとは座席順）
  const ids = ON.role === 'host' ? [ON.me, ...ON.seats] : (hostP ? [hostP.peer, ...ON.seats] : []);
  ON.members = ids.map(id => {
    if (id === ON.me) return { peer: id, me: true, host: ON.role === 'host', name: ON.name, ch: S.ch, font: S.font, xf: S.xf, skill: S.skill, passive: S.passive, ready: ON.ready, g: S.g };
    const p = byPeer.get(id);
    if (!p) return null;
    const pr = p.presence, dk = pr.deck && typeof pr.deck === 'object' ? pr.deck : {};
    const ch = cleanCh(dk.ch), font = cleanFont(dk.font), xf = cleanXf(dk.xf);
    return { peer: id, me: false, host: pr.role === 'host', name: cleanName(pr.name) || '名無し', ch, font, xf, skill: cleanSkill(dk.skill),
      passive: PASSIVES[dk.passive] ? dk.passive : 'none', ready: pr.ready === true, hasDeck: !!(ch && font),
      g: ch && font ? glyphFor(ch, font, xf) : null, pres: pr };
  }).filter(Boolean);
  chatSync(others);
  // 古い（または新しい）版のページを開いている人がいると試合が始まらないので、はっきり知らせる
  ON.stale = ON.members.some(m => !m.me && m.pres && m.pres.v !== PROTO);
  if (ON.stale) onMsg('ページの版が違う参加者がいるため、試合を始められません。全員ページを再読み込み（更新）してください。');
  if (ON.role === 'host') hostTick(byPeer); else guestTick(hostP ? hostP.presence : null);
  updateRoomUI();
}

function hostLeft() {
  if (S.mode !== 'idle') backToSetup();
  ON.phase = 'lobby'; ON.myShot = null;
  onMsg('ホストが退出しました。ルームを出て、入り直してください。');
}

// ホスト：試合中に抜けた人のコマは、その場で退場させる
function markGone(i) {
  ON.gone.add(i);
  const B = S.battle;
  if (B && !B.remote && !B.over) {
    const t = B.tops[i];
    if (t && t.state === 'spin') { t.state = 'out'; t.reason = '退出'; t.y = -60; t.vx = t.vz = 0; }
  }
}

const validShot = p => {
  const sh = p && p.presence && p.presence.shot;
  if (!sh || typeof sh !== 'object' || sh.m !== ON.m) return null;
  return { p: num(sh.p, 0, 1, .5), a: typeof sh.a === 'number' ? num(sh.a, -10, 10, undefined) : undefined };
};

// ホスト：全員の準備がそろったら試合を始め、全員のシュートがそろったら計算を始める
function hostTick(byPeer) {
  if (!ON.R || ON.role !== 'host') return;
  byPeer = byPeer || new Map(ON.R.peers().filter(p => !p.sameTab).map(p => [p.peer, p]));
  const guests = ON.members.filter(m => !m.me);
  if ((ON.phase === 'lobby' || ON.phase === 'result') && S.mode === 'idle' && ON.ready && S.g &&
      guests.length >= 1 && guests.every(m => m.ready && m.g)) {
    ON.m++; ON.phase = 'launch'; ON.ready = false; ON.myShot = null; ON.gone = new Set(); ON.skLast = new Map(); ON.skPend = new Map(); ON.stLast = new Map();
    ON.players = ON.members.map(m => m.peer);
    ON.R.presence({ phase: 'launch', m: ON.m, players: ON.players, ready: false, res: null, s: null }).catch(() => {});
    S.kind = 'online';
    toLaunch(ON.members.map(m => ({ ch: m.ch, font: m.font, g: m.g, skill: m.skill, passive: m.passive, name: m.name })), 0);
    return;
  }
  if (ON.phase === 'launch' || ON.phase === 'battle') {
    for (let i = 1; i < ON.players.length; i++) if (!byPeer.has(ON.players[i]) && !ON.gone.has(i)) markGone(i);
    if (ON.phase === 'launch' && ON.gone.size >= ON.players.length - 1) {
      // ほかの全員が抜けたら試合をやめる
      ON.phase = 'lobby';
      ON.R.presence({ phase: 'lobby', s: null }).catch(() => {});
      backToSetup();
      onMsg('ほかの参加者が全員退出しました。');
      return;
    }
  }
  if (ON.phase === 'launch' && S.mode === 'launch' && ON.myShot) {
    const shots = ON.players.map((id, i) => i === 0 ? ON.myShot : ON.gone.has(i) ? 'gone' : validShot(byPeer.get(id)));
    // 20秒たってもそろわなければ、まだの人は標準の強さで打ち出す
    const late = performance.now() - S.launchAt > 20000;
    if (shots.every(Boolean) || late) {
      S.battle = newBattle(S.players.map((pl, i) => {
        const sh = shots[i];
        return sh === 'gone' ? { g: pl.g, skill: pl.skill, passive: pl.passive, p: .5, gone: true }
          : { g: pl.g, skill: pl.skill, passive: pl.passive, p: sh ? sh.p : .5, a: sh ? sh.a : undefined };
      }));
      ON.phase = 'battle'; ON.hits = []; ON.evs = [];
      startBattleMeshes();
      ON.R.presence({ phase: 'battle' }).catch(() => {});
    }
  }
  if (ON.phase === 'battle' && S.battle && !S.battle.over) {
    // ゲストのスキル使用：回数 n が増えていたら1回使う（使えるかどうかはここで判定する）
    ON.players.forEach((id, i) => {
      if (i === 0) return;
      const p = byPeer.get(id), sk = p && p.presence.sk;
      if (!sk || typeof sk !== 'object' || sk.m !== ON.m) return;
      const n = num(sk.n, 0, 1e9, 0);
      if (n <= (ON.skLast.get(i) || 0)) return;
      // 届いた時点でまだ使えなければ0.6秒だけ待ち、使えるようになったら使う
      const pend = ON.skPend.get(i);
      if (!pend || pend.n !== n) ON.skPend.set(i, { n, at: S.battle.t });
      const since = S.battle.t - ON.skPend.get(i).at;
      if (useSkill(S.battle, i) || since > .6) { ON.skLast.set(i, n); ON.skPend.delete(i); }
    });
    // ゲストの「操縦」：タップした場所（番号 n が増えたときだけ）
    ON.players.forEach((id, i) => {
      if (i === 0) return;
      const p = byPeer.get(id), st = p && p.presence.st;
      if (!st || typeof st !== 'object' || st.m !== ON.m) return;
      const n = num(st.n, 0, 1e9, 0);
      if (n <= (ON.stLast.get(i) || 0)) return;
      ON.stLast.set(i, n);
      steerTo(S.battle, i, num(st.x, -8, 8, 0), num(st.z, -8, 8, 0));
    });
  }
}

const packTop = (t, B) => [t.x, t.z, t.th % (Math.PI * 2), t.w, t.y, t.state === 'spin' ? 0 : t.state === 'down' ? 1 : 2, t.fall, t.w0,
  Math.max(0, t.cdUntil - B.t), Math.min(99, t.uses), t.guard > 0 ? 1 : 0, t.reason === '退出' ? 1 : 0, Math.max(0, effectLeft(t))]
  .map(v => Math.round(v * 1000) / 1000);

// ホスト：毎秒約30回、盤面の状態を送る
function hostSend(now) {
  if (now - ON.sentAt < 33) return;
  ON.sentAt = now;
  const B = S.battle;
  const s = { m: ON.m, t: Math.round(B.t * 100) / 100, T: B.tops.map(t => packTop(t, B)), h: ON.hits.slice(-6), e: ON.evs.slice(-6) };
  if (B.over) s.o = [B.winIdx, B.code, Math.round(B.overAt * 10) / 10, B.order];
  ON.R.presence({ s }).catch(() => {});
}

// ゲスト：ホストの進行に合わせて画面を切り替え、届いた状態を描画に反映する
function guestTick(hp) {
  if (!hp || !ON.R) return;
  const m = Math.floor(num(hp.m, 0, 1e6, 0));
  if (hp.phase === 'launch' && m > ON.m && S.mode === 'idle' && S.g) {
    const ids = Array.isArray(hp.players) ? hp.players.filter(x => typeof x === 'string').slice(0, MAX_PLAYERS) : [];
    const myIdx = ids.indexOf(ON.me);
    if (myIdx < 0) { ON.m = m; onMsg('試合が始まりました。次の試合から参加できます。'); return; }
    const players = ids.map(id => {
      if (id === ON.me) return { ch: S.ch, font: S.font, g: S.g, skill: S.skill, passive: S.passive, name: ON.name };
      const mm = ON.members.find(x => x.peer === id);
      return mm && mm.g ? { ch: mm.ch, font: mm.font, g: mm.g, skill: mm.skill, passive: mm.passive, name: mm.name } : null;
    });
    if (players.some(p => !p)) return;   // 文字の形を読み込み中。次の更新でもう一度試す
    ON.m = m; ON.ready = false; ON.myShot = null; ON.seenHit = 0; ON.seenEv = 0; ON.players = ids;
    ON.R.presence({ ready: false, shot: null }).catch(() => {});
    S.kind = 'online';
    toLaunch(players, myIdx);
  }
  if (hp.phase === 'lobby' && m === ON.m && S.mode === 'launch') { backToSetup(); onMsg('ほかの参加者が退出したため、試合を取りやめました。'); }
  if (hp.phase === 'battle' && m === ON.m && S.mode === 'launch' && ON.myShot) {
    S.battle = { remote: true, t: 0, over: false, tops: S.players.map(p => ({ g: p.g, x: 0, z: 0, tx: 0, tz: 0, y: 0, th: 0, w: 40, w0: 40,
      state: 'spin', prec: 0, fall: 0, cdLeft: SKILLS[p.skill].after || 1, uses: SKILLS[p.skill].uses || 99, guard: 0, reason: '' })) };
    startBattleMeshes();
  }
  const s = hp.s;
  if (S.battle && S.battle.remote && s && typeof s === 'object' && s.m === ON.m) applySnap(s);
}

function applySnap(s) {
  const B = S.battle;
  const first = !B.got;
  if (!Array.isArray(s.T)) return;
  s.T.slice(0, B.tops.length).forEach((a, i) => {
    if (!Array.isArray(a) || a.length < 12) return;
    const t = B.tops[i];
    t.tx = num(a[0], -20, 20, 0); t.tz = num(a[1], -20, 20, 0);
    if (first) { t.x = t.tx; t.z = t.tz; t.th = num(a[2], -10, 10, 0); }
    t.w = num(a[3], 0, 200, 0); t.y = num(a[4], -80, 5, 0);
    t.state = ['spin', 'down', 'out'][num(a[5], 0, 2, 0) | 0];
    t.fall = num(a[6], 0, 1, 0); t.w0 = num(a[7], 1, 200, 40);
    t.cdLeft = num(a[8], 0, 99, 0); t.uses = num(a[9], 0, 99, 0); t.guard = a[10] ? 1 : 0;
    t.reason = a[11] ? '退出' : '';
    t.effLeft = num(a[12], 0, EFFECT_FOREVER, 0);
  });
  B.got = true;
  B.t = num(s.t, 0, 600, B.t);
  if (Array.isArray(s.h)) for (const h of s.h) {
    if (!Array.isArray(h) || h.length < 4) continue;
    const k = num(h[0], 0, 1e9, 0);
    if (k <= ON.seenHit) continue;
    ON.seenHit = k;
    const j = num(h[3], 0, 50, 1);
    burst(num(h[1], -20, 20, 0), .5, num(h[2], -20, 20, 0), Math.min(14, 3 + j * 2), j); clink(j);
  }
  if (Array.isArray(s.e)) for (const e of s.e) {
    if (!Array.isArray(e) || e.length < 3) continue;
    const k = num(e[0], 0, 1e9, 0);
    if (k <= ON.seenEv) continue;
    ON.seenEv = k;
    showSkillToast(num(e[1], 0, B.tops.length - 1, 0) | 0, EVENT_IDS[num(e[2], 0, EVENT_IDS.length - 1, 0) | 0]);
  }
  if (Array.isArray(s.o) && !B.over) {
    const n = B.tops.length;
    B.over = true; B.winIdx = num(s.o[0], 0, n - 1, 0) | 0;
    B.code = REASON[s.o[1]] ? s.o[1] : 'time'; B.overAt = num(s.o[2], 0, 600, B.t);
    B.order = Array.isArray(s.o[3]) ? s.o[3].map(v => num(v, 0, n - 1, 0) | 0).slice(0, n) : null;
    B.overSeen = performance.now();
  }
}

  else if (!waiting.length) line = '全員そろいました。まもなく始まります。';

  $('readyStatus').textContent = line;
  $('onRecord').textContent = `この部屋の成績 ${ON.rec.w}勝 ${ON.rec.l}敗`;

// 「操縦」中にスタジアムをタップ（クリック）すると、その場所へ向きを変える
const raycaster = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -.6), hitPoint = new THREE.Vector3();
canvas.addEventListener('pointerdown', e => {
  const B = S.battle;
  if (S.mode !== 'battle' || !B || B.over) return;
  const t = B.tops[S.myIdx];
  const active = B.remote ? (t.effLeft > 0 && S.players[S.myIdx].skill === 'steer') : t.steer > 0;
  if (!active || t.state !== 'spin') return;

  raycaster.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -((e.clientY - r.top) / r.height * 2 - 1) }, camera);
  if (!raycaster.ray.intersectPlane(floorPlane, hitPoint)) return;
  burst(hitPoint.x, .7, hitPoint.z, 8, 1);   // タップした場所の目印
  if (B.remote) {
    ON.stN = (ON.stN || 0) + 1;
    ON.R.presence({ st: { m: ON.m, n: ON.stN, x: +hitPoint.x.toFixed(2), z: +hitPoint.z.toFixed(2) } }).catch(() => {});
  } else steerTo(B, S.myIdx, hitPoint.x, hitPoint.z);
});

// ───────── ループ ─────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S.mode === 'idle' && S.idle && S.idleMesh) {
    S.idle.th += S.idle.w * dt; placeMesh(S.idleMesh, S.idle);
  }
  if (S.mode === 'launch') {
    if (S.stage === 'power') {
      S.gauge += S.gaugeDir * dt * 1.1;
      if (S.gauge > 1) { S.gauge = 1; S.gaugeDir = -1; }
      if (S.gauge < 0) { S.gauge = 0; S.gaugeDir = 1; }
      $('gaugeFill').style.width = (S.gauge * 100) + '%';
    }
    if (S.stage === 'aim') {
      S.aim = (S.aim + dt * 2.4) % (Math.PI * 2);   // 約2.6秒で1周
      const [mx, mz] = startPos(S.myIdx, S.players.length);
      placeArrow(mx, mz, S.aim);
    }
    if (S.preview) S.preview.forEach((t, i) => { t.th += t.w * dt; if (S.meshes[i]) placeMesh(S.meshes[i], t); });
    // オンラインでは放置で相手を待たせないよう、12秒で自動的に打つ
    if (S.kind === 'online' && ON.myShot == null && now - S.launchAt > 12000) { shoot(); shoot(); }
    if (S.kind === 'online' && ON.role === 'host' && ON.myShot) hostTick();
  }
  if ((S.mode === 'battle' || S.mode === 'result') && S.battle) {
    const B = S.battle;
    if (B.remote) {
      const k = Math.min(1, dt * 15);
      for (const t of B.tops) {
        t.x += (t.tx - t.x) * k; t.z += (t.tz - t.z) * k; t.th += t.w * dt;
        if (t.effLeft > 0 && t.effLeft < EFFECT_FOREVER) t.effLeft = Math.max(0, t.effLeft - dt);
        if (t.cdLeft > 0) t.cdLeft = Math.max(0, t.cdLeft - dt);
      }
    } else {
      if (!B.over || B.t - B.overAt < 3) stepBattle(B);
      // CPU は0.25秒ごとにスキルを使うか考える
      if (S.kind === 'cpu' && !B.over && B.t - S.aiAt > .25) { S.aiAt = B.t; for (let i = 1; i < B.tops.length; i++) cpuSkillAI(B, i); }
      for (const h of _hits) {
        burst(h.x, .5, h.z, Math.min(14, 3 + h.j * 2), h.j); clink(h.j);
        if (S.kind === 'online') ON.hits.push([++ON.hitSeq, +h.x.toFixed(2), +h.z.toFixed(2), +h.j.toFixed(2)]);
      }
      _hits.length = 0;
      for (const [i, id] of B.events) {
        showSkillToast(i, id);
        if (S.kind === 'online') ON.evs.push([++ON.evSeq, i, EVENT_IDS.indexOf(id)]);
      }
      B.events.length = 0;
      if (ON.hits.length > 12) ON.hits.splice(0, ON.hits.length - 12);
      if (ON.evs.length > 12) ON.evs.splice(0, ON.evs.length - 12);
      if (S.kind === 'online' && ON.R && ON.role === 'host' && ON.skPend.size && !B.over) hostTick();
      if (S.kind === 'online' && ON.R && ON.role === 'host' && (!B.over || B.t - B.overAt < 3.5)) hostSend(now);
    }
    B.tops.forEach((t, i) => { if (S.meshes[i]) placeMesh(S.meshes[i], t); });
    B.tops.forEach((t, i) => {
      const h = S.hud[i];
      if (!h) return;
      h.bar.style.width = (clamp01(t.w / 64) * 100) + '%';
      h.side.classList.toggle('out', t.state !== 'spin');
    });
    $('timer').textContent = Math.max(0, Math.ceil(MATCH_TIME - B.t));
    if (S.mode === 'battle') updateSkillBtn();
    const doneLocal = !B.remote && B.over && B.t - B.overAt > 1.2;
    const doneRemote = B.remote && B.over && now - B.overSeen > 1200;
    if (S.mode === 'battle' && (doneLocal || doneRemote)) finish();
  }
  // 壁の回転：対戦中は試合時間に合わせ（ポケットの位置と一致させる）、待機中はゆっくり回して見せる
  if (S.battle && (S.mode === 'battle' || S.mode === 'result')) wallGroup.rotation.y = -S.battle.t * WALL_SPEED;
  else if (S.mode === 'idle') wallGroup.rotation.y = -now / 1000 * WALL_SPEED * .5;
  else wallGroup.rotation.y = 0;
  stepSparks(dt);
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resize();
renderFontChips();
renderSkills();
renderPassives();
renderCpuCount();
updateRoomUI();
initRoom();
Promise.all([rerollCpus(), refreshGlyph()]).then(() => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
